<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar style="--background: #ff6b35; color: white;">
    <ion-title style="font-weight: 800; font-size: 1.5rem;">
      CookBook 🍳
    </ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/favorites" style="--color: white;">
        <ion-icon name="heart" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar style="--background: #ff6b35; padding-bottom: 15px;">
    <ion-searchbar 
      placeholder="Search recipes..." 
      [(ngModel)]="searchTerm"
      (ionChange)="onSearchChange($event)" 
      [debounce]="500"
      animated="true"
      style="--background: white; --border-radius: 14px; --box-shadow: none; width: 94%; margin: 0 auto;">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div class="categories-scroll">
    <div class="category-item" 
         [class.active]="activeCategory === ''" 
         (click)="selectCategory(activeCategory)">
      <div class="cat-img-box">
        <ion-icon name="restaurant" style="font-size: 20px; color: #555;"></ion-icon>
      </div>
      <span>All</span>
    </div>

    <div class="category-item" 
         *ngFor="let cat of categories" 
         [class.active]="activeCategory === cat.strCategory"
         (click)="selectCategory(cat.strCategory)">
      <div class="cat-img-box">
        <img [src]="cat.strCategoryThumb" />
      </div>
      <span>{{ cat.strCategory }}</span>
    </div>
  </div>

  <div *ngIf="meals.length === 0" class="ion-text-center ion-padding" style="margin-top: 40px; opacity: 0.6;">
    <p style="font-size: 1.2rem; font-weight: 500;">
      No recipes found 😔
    </p>
  </div>

  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="4" *ngFor="let meal of meals">
        <ion-card button [routerLink]="['/recipe-details', meal.idMeal]">
          <img [src]="meal.strMealThumb" [alt]="meal.strMeal" />
          <ion-card-header>
            <ion-card-title>{{ meal.strMeal }}</ion-card-title>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
