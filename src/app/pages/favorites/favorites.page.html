<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar style="--background: #ff6b35; color: white;">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" color="light" text=""></ion-back-button>
    </ion-buttons>
    <ion-title style="font-weight: 800;">My Favorites ❤️</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div *ngIf="favoriteMeals.length === 0" class="ion-text-center ion-padding" style="margin-top: 50px; opacity: 0.6;">
    <h2>It's empty here...</h2>
    <p>Go back and add some recipes you like!</p>
  </div>

  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" *ngFor="let meal of favoriteMeals">
        
        <ion-card button [routerLink]="['/recipe-details', meal.idMeal]">
          <img [src]="meal.strMealThumb" [alt]="meal.strMeal"/>
          
          <ion-card-header>
            <div style="display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap;">
              <ion-chip color="tertiary" mode="ios" outline="true" style="height: 24px; font-size: 0.75rem;">
                <ion-icon name="restaurant"></ion-icon>
                <ion-label>{{ meal.strCategory }}</ion-label>
              </ion-chip>
              
              <ion-chip color="medium" mode="ios" outline="true" style="height: 24px; font-size: 0.75rem;">
                <ion-icon name="globe"></ion-icon>
                <ion-label>{{ meal.strArea }}</ion-label>
              </ion-chip>
            </div>

            <ion-card-title>{{ meal.strMeal }}</ion-card-title>
          </ion-card-header>
        </ion-card>

      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>
